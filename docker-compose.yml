version: "3.9"
services:
  mysql:
    image: mysql:8.4
    container_name: airguitar-mysql
    environment:
      MYSQL_DATABASE: airguitar
      MYSQL_USER: airguitar
      MYSQL_PASSWORD: airguitar
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
