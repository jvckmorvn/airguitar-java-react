spring.application.name=airguitar

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/airguitar?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=airguitar
spring.datasource.password=airguitar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=change-this-secret-in-production-please-at-least-256-bit
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173